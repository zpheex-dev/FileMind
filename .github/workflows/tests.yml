name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install ".[dev]"
      - name: Check Linux launcher
        if: runner.os == 'Linux'
        run: bash -n run_filemind.sh
      - run: python -m pytest -q
      - name: Smoke test Linux launcher
        if: runner.os == 'Linux'
        run: timeout 30s bash run_filemind.sh --smoke-test
      - name: Verify Windows executable and bundled icon
        if: runner.os == 'Windows' && matrix.python == '3.12'
        run: |
          python -m pip install ".[build]"
          python build_app.py
          python -c "import subprocess; subprocess.run(['dist/FileMind.exe','--smoke-test'],check=True,timeout=90)"
      - name: Upload tested Windows preview
        if: github.event_name == 'pull_request' && runner.os == 'Windows' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: FileMind-Windows-preview
          path: dist/FileMind.exe
          if-no-files-found: error
