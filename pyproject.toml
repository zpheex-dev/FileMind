[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filemind"
version = "0.3.0"
description = "A local-first desktop file organizer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,!=6.12.0,<7",
    "PyMuPDF>=1.24,<2",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
]
build = [
    "pyinstaller>=6.14,<7",
]

[project.scripts]
filemind = "filemind.gui.app:main"
filemind-scan = "filemind.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
"filemind.gui" = ["assets/*.svg"]
